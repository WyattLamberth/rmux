name: Quality and release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  rust:
    name: Rust quality (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.96.1'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked --all-targets --all-features
      - run: cargo test --workspace --locked --doc --all-features
      - run: python3 scripts/check-architecture.py

  universe:
    name: Universe seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: ['0', '1', '42', '1337', '18446744073709551615']
    env:
      RMUX_TEST_SEED: ${{ matrix.seed }}
      RMUX_TEST_STEPS: '20000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.96.1'
      - name: Replay deterministic universe
        run: bash scripts/test-seeds.sh

  adapter-tests:
    name: Real PTY and HTTP adapters (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RMUX_TEST_SHELL: /bin/sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.96.1'
      - run: cargo test --workspace --locked --all-features --test pty --test metrics --test terminal -- --nocapture

  coverage:
    name: Workspace coverage artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RMUX_TEST_SEED: '42'
      RMUX_TEST_STEPS: '20000'
      RMUX_TEST_SHELL: /bin/sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.96.1'
          components: llvm-tools-preview
      - name: Install pinned coverage tool with its published lockfile
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --workspace --locked --all-targets --all-features --no-report
      - run: cargo llvm-cov --workspace --locked --all-targets --all-features --no-run --html --output-dir coverage
      - run: cargo llvm-cov --workspace --locked --all-targets --all-features --no-run --lcov --output-path coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  benchmark:
    name: Production transition benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RMUX_BENCH_ITERATIONS: '1000000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.96.1'
      - name: Record environment and release-mode measurements
        run: |
          mkdir -p benchmark-results
          rustc --version --verbose > benchmark-results/environment.txt
          uname -a >> benchmark-results/environment.txt
          printf 'revision=%s\n' "$GITHUB_SHA" >> benchmark-results/environment.txt
          cargo run --locked --release --package rmux --example benchmark | tee benchmark-results/benchmark.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-transition-benchmark
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 14

  nix:
    name: Nix package and infrastructure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --no-update-lock-file --print-build-logs
      - run: nix build --no-update-lock-file --print-build-logs
      - name: Verify root runtime binary is installed
        run: test -x result/bin/rmux
      - run: nix develop --no-update-lock-file --command actionlint
      - run: nix develop --no-update-lock-file --command shellcheck scripts/ci.sh scripts/test-seeds.sh
      - run: python3 -m json.tool observability/grafana/dashboards/rmux.json > /dev/null
      - run: docker compose -f observability/compose.yaml config --quiet
      - name: Validate Prometheus configuration with its pinned image
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.5.5 check config /etc/prometheus/prometheus.yml
      - name: Start local telemetry and verify provisioned dashboard
        run: |
          docker compose -f observability/compose.yaml up --detach
          timeout 90 bash -c 'until curl --fail --silent http://127.0.0.1:9090/-/ready && curl --fail --silent http://127.0.0.1:3000/api/health; do sleep 2; done'
          curl --fail --silent http://127.0.0.1:3000/api/dashboards/uid/rmux-runtime > /tmp/rmux-dashboard.json
          python3 -c 'import json; d=json.load(open("/tmp/rmux-dashboard.json")); assert len(d["dashboard"]["panels"]) >= 5'
      - name: Stop telemetry fixtures
        if: always()
        run: docker compose -f observability/compose.yaml down --volumes

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix develop --no-update-lock-file --command cargo audit --deny warnings

  release:
    name: Linux x86_64 release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, universe, adapter-tests, coverage, benchmark, nix, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-release-version.py
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.96.1'
      - run: cargo build --workspace --locked --release --bin rmux --target x86_64-unknown-linux-gnu
      - name: Package binary and SHA-256 checksum
        run: |
          python3 scripts/package-release.py \
            --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" \
            --target x86_64-unknown-linux-gnu \
            --binary target/x86_64-unknown-linux-gnu/release/rmux
          (cd dist && sha256sum --check ./*.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmux-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error
          retention-days: 30
